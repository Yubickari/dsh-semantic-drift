name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write      # create the GitHub release
  id-token: write      # OIDC: npm trusted publishing + provenance

jobs:
  publish:
    # Pin the runner: `ubuntu-latest` is migrating in 2026 and a surprise image
    # change is the last thing a release should discover.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; the Node 24 bundle is newer, but
      # the version is stated rather than assumed.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the manifest
        run: |
          node -e '
            const version = require("./package.json").version
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (version !== tag) {
              console.error(`tag ${tag} does not match package.json ${version}`)
              process.exit(1)
            }
          '
      - run: pnpm test
      - run: pnpm build
      - name: The committed bundle matches the source
        run: git diff --exit-code -- lib
      # No token: the publish authenticates with GitHub's OIDC identity, which the
      # package must be told to trust first — npmjs → the package → Settings →
      # Trusted publishing → GitHub Actions, repository `Yubickari/dsh-semantic-drift`,
      # workflow `release.yml`. Provenance is produced by the same exchange.
      - name: Publish to npm
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm view "dsh-semantic-drift@${version}" version >/dev/null 2>&1; then
            echo "::notice::dsh-semantic-drift@${version} is already on npm; nothing to publish"
            exit 0
          fi
          npm publish --provenance --access public
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # `github.ref_name` is already `vX.Y.Z` for a tag push; prefixing it again
          # produced "vv0.1.2".
          name: ${{ github.ref_name }}
