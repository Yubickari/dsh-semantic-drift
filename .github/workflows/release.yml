name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write      # create the GitHub release
  id-token: write      # OIDC: npm trusted publishing + provenance

jobs:
  publish:
    # Pin the runner: `ubuntu-latest` is migrating in 2026 and a surprise image
    # change is the last thing a release should discover.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; the Node 24 bundle is newer, but
      # the version is stated rather than assumed.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the manifest
        run: |
          node -e '
            const version = require("./package.json").version
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (version !== tag) {
              console.error(`tag ${tag} does not match package.json ${version}`)
              process.exit(1)
            }
          '
      - run: pnpm test
      - run: pnpm build
      - name: The committed bundle matches the source
        run: git diff --exit-code -- lib
      # Prefer OIDC (no secret to rotate); the OIDC exchange was denied by npm once
      # ("OIDC permission denied for this action"), most likely a trusted-publisher
      # entry that does not allow `npm publish`. A configured NPM_TOKEN therefore
      # takes over, and the run says which path it used. Both paths publish
      # provenance, because `id-token: write` is granted either way.
      - name: Does this version need publishing?
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "dsh-semantic-drift@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-semantic-drift@${version} is already on npm; nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Which credential can publish?
        id: auth
        if: steps.check.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing with the NPM_TOKEN secret"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::no NPM_TOKEN secret; publishing through OIDC trusted publishing"
          fi
      - name: Publish to npm (token)
        if: steps.check.outputs.publish == 'true' && steps.auth.outputs.mode == 'token'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to npm (OIDC)
        if: steps.check.outputs.publish == 'true' && steps.auth.outputs.mode == 'oidc'
        run: npm publish --provenance --access public
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # `github.ref_name` is already `vX.Y.Z` for a tag push; prefixing it again
          # produced "vv0.1.2".
          name: ${{ github.ref_name }}
