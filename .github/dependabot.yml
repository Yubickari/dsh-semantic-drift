version: 2
updates:
  # Runtime and dev dependencies. esbuild and the test stack move quickly; the
  # lockfile is committed, so a PR here is a one-line review plus the CI run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  # The workflows pin major versions; keep them current so a deprecated runner
  # does not surface during a release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
