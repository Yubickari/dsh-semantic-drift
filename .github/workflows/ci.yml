name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the first 22.x with type stripping on by default, which the
        # test files rely on.
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: The committed bundle matches the source
        run: git diff --exit-code -- lib
