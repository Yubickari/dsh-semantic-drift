name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write      # create the GitHub release

jobs:
  publish:
    # Pin the runner: `ubuntu-latest` is migrating in 2026 and a surprise image
    # change is the last thing a release should discover.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the manifest
        run: |
          node -e '
            const version = require("./package.json").version
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (version !== tag) {
              console.error(`tag ${tag} does not match package.json ${version}`)
              process.exit(1)
            }
          '
      - run: pnpm test
      - run: pnpm build
      - name: The committed bundle matches the source
        run: git diff --exit-code -- lib
      - name: The npm token is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN secret is empty. Add a granular npm token (read+write on this package) under Settings → Secrets and variables → Actions, then push the tag again."
            exit 1
          fi
          npm whoami
      # Provenance needs a public repository: GitHub signs the attestation against
      # a source commit that anyone must be able to fetch. Add `--provenance` back
      # once the repository is public.
      - name: Publish to npm
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm view "dsh-semantic-drift@${version}" version >/dev/null 2>&1; then
            echo "::notice::dsh-semantic-drift@${version} is already on npm; nothing to publish"
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: v${{ github.ref_name }}
